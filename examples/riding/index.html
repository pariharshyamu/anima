<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>ANIMA — riding</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; }
      #note { position: fixed; top: 10px; left: 12px; color: #eef2f7; z-index: 5;
        font: 13px/1.45 system-ui, sans-serif; user-select: none; max-width: 30em;
        text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
      #hud { position: fixed; top: 10px; right: 12px; color: #fff; z-index: 5;
        text-align: right; font: 600 15px/1.6 system-ui; text-shadow: 0 1px 3px #000;
        user-select: none; }
      #hud b { color: #ffd889; }
      kbd { background: #2a3140; border-radius: 3px; padding: 0 4px; font: 12px monospace; }
    </style>
  </head>
  <body>
    <div id="note">
      <strong>ANIMA — riding</strong> · <kbd>W</kbd>/<kbd>S</kbd> urge on and
      steady, <kbd>A</kbd>/<kbd>D</kbd> rein, <kbd>Space</kbd> halt,
      <kbd>E</kbd> mount / dismount, <kbd>C</kbd> climb the ladder. On a
      phone: joystick plus the buttons. The horse picks its own gait from
      its speed, and the rider changes seat to match — sitting at the walk,
      <em>posting</em> to the trot, up in two-point to gallop.
    </div>
    <div id="hud"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
