<body><div id="note"><strong>ANIMA — sea legs</strong> · four sailors on a carrack under
way in a swell. Nothing moves them along except the deck: <code>ride</code> carries them,
<code>deckAt</code> plants them, and they take the heel in their legs rather than tipping
over with it. In a big enough sea they lose their footing.</div>
