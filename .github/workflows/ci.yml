# The gates, on every push.
#
# ANIMA animates bodies, and a unit test can only ever check the numbers a
# clip produces. It cannot see that the knee bends backwards, that the foot
# skates, that the horse's footfall order is wrong, or that a skinned mesh
# clone is still bound to the original's bones and every copy walks in
# lockstep. Every one of those was a real bug here and every one was found by
# rendering it. Hence the second job.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  check:
    name: typecheck, tests, build, nineteen gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Foot skate, measured off the built bundle's own bone transforms and
      # compared against the speeds its closed-form geometry declares. Three
      # shipped defects came out of this: a stride factor nobody had measured,
      # a constant the poser and the speed formula disagreed about, and
      # keyframe density that quietly followed the playback rate. Not one of
      # them could fail a unit test or show up in a still frame.
      - run: npm run skate
      # The other five measure the same kind of thing one movement over: hands
      # on rungs, hands and feet on a wall and the landing on the floor, a
      # modulation layer that stays monotone and gives the body back, and a bar
      # that stays over mid-foot through a set that visibly decays. Every one
      # of them has been watched failing; a gate nobody has watched fail is a
      # decoration, and a gate CI does not run is not a gate.
      - run: npm run climb
      - run: npm run parkour
      - run: npm run mood
      - run: npm run lifting
      - run: npm run dining
      - run: npm run archery
      - run: npm run striking
      - run: npm run guard
      - run: npm run grappling
      - run: npm run fightstyle
      - run: npm run sparring
      - run: npm run tameshiwari
      # ...and the fourteenth is the only one with a closed form on the other
      # side. A uniform steel bar's inertia, sweet spot and pendulum period are
      # textbook exact, so a segment sum that gets a tapered sword subtly wrong
      # gets the bar wrong in the twelfth decimal place. The javelin is checked
      # against a rule book rather than a range: 800 g, and the centre of mass
      # 0.90-1.06 m from the tip, neither of them typed in.
      - run: npm run blade
      # The fifteenth is the one that checks a DISAGREEMENT rather than an
      # agreement. A stress criterion puts a sharp point through skin at six
      # milli-newtons and instrumented knives say tens of newtons; if those two
      # numbers ever converge, somebody has fitted one to the other, and that
      # is what the budget is guarding.
      - run: npm run cut
      # The sixteenth checks that two mechanisms keep DISAGREEING. Whether a
      # crossing grips is Coulomb friction; whether it stays put is the
      # conditioning of a line intersection. They point opposite ways and there
      # is no angle that does both — and the one chosen constant in the module
      # is run at ten times its value to prove nothing rests on it.
      - run: npm run bind
      # The seventeenth is checked against a RULE CHANGE. On 1 April 1986 the
      # IAAF moved the javelin's centre of mass 4 cm forward to take about 10%
      # off the distances; the model reproduces the direction in all 27 release
      # conditions and about a seventh of the size, and both halves of that are
      # budgets. A cost that suddenly reaches 10% means somebody fitted a lift
      # coefficient to the only external check in the file.
      - run: npm run javelin
      # The eighteenth is the second that imports two libraries, and the one
      # that finishes. Tameshiwari needed the compliance of a fist and never got
      # it; a plate needs a CONTACT DIAMETER, which is a ruler measurement, so
      # the comparison completes — and it turns out a 800 J kick is twelve times
      # further from holing plate than a 75 J arrow.
      - run: npm run armour
      # The nineteenth is the armed bout, and the first assertion in it is that
      # the fencers MOVED. A bout where nobody walked is what this release
      # exists to stop shipping, and it is checked before anything about who
      # won. The tempo is √(2θI/τ) — the blade's own inertia against the couple
      # its hilt allows — so nothing in the weapon table says "speed".
      - run: npm run fencing

  browser:
    name: every example renders
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium only — nothing here touches Firefox or WebKit, and
      # --with-deps supplies the system libraries a bare runner lacks.
      - run: npx playwright install --with-deps chromium
      # The playground examples ARE the docs site.
      - run: npm run site:build
      # A canvas existing and `gl.getError()` returning zero are both true of a
      # completely blank frame. This measures pixels.
      - run: node site/verify-playgrounds.mjs

      # `include-hidden-files` is not optional: the shot directory is
      # `.playground-shots`, and upload-artifact excludes dotfiles by default —
      # it uploads nothing while reporting success. Measured on GAMA's first CI
      # run, which is the only way anybody finds this out.
      - name: upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: .playground-shots/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
